<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- StyleSheet -->
    <link rel="stylesheet" href="styles/style.css" />

    <!-- DaisyUI + Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] min-h-screen">
    
    <section class="pt-30">
      <div class="login-container mx-auto text-center bg-white max-w-md">
        <div class="logo mx-auto">
          <img class="mx-auto mb-8 pt-8" src="assets/github-logo.png" alt="" />
          <h2 class="font-bold text-3xl text-[#1F2937]">
            GitHub Issues Tracker
          </h2>
          <h2 class="text-[#647488]">Sign in to manage your issues</h2>
        </div>

        <div class="form">
          <div class="card w-full max-w-sm shrink-0 mx-auto">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-semibold">Username</label>
                <input id="input-username" type="text" class="input" placeholder="Enter Username" value="admin" />
                <label class="label text-[#4A00FF]">Default: admin</label>
                <label class="label font-semibold">Password</label>
                <input id="input-password"
                  type="password"
                  class="input"
                  placeholder="Enter Password"
                />
                <label class="label text-[#4A00FF]">Default: admin123</label>
                <label class="label">
                  <input type="checkbox" checked="checked" class="checkbox" />
                  Remember me
                </label>
                <button id="login-btn" class="btn btn-primary mt-4">Sign In</button>
              </fieldset>
            </div>
          </div>
        </div>
      </div>
    </section>   
    

    <script src="scripts/script.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
