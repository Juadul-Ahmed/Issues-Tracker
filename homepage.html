<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- StyleSheet -->
    <link rel="stylesheet" href="styles/style.css" />

    <!-- DaisyUI + Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] min-h-screen"> 
   
    <nav>
     <div class="navbar bg-base-100 shadow-sm flex flex-col md:flex-row items-center justify-between px-4 py-2">
    <!-- Logo + Title -->
    <div class="flex items-center w-full md:w-auto mb-2 md:mb-0">
      <img class="w-10 mr-2" src="assets/github-logo.png" alt="GitHub Logo">
      <a class="btn btn-ghost text-xl p-0 normal-case">GitHub Issues Tracker</a>
    </div>

    <!-- Search -->
    <div class="flex w-full md:w-auto items-center gap-2">
      <input id="input-search" type="text" placeholder="Search" class="input input-bordered w-40 md:w-40" />
      <button id="btn-search" class="btn btn-primary w-30 md:w-40">Search</button>
    </div>
  </div>
    </nav>

      <section class="w-11/12 bg-white mx-auto mt-10 shadow-sm rounded-md">
      <div class="buttons ml-5 mb-4 p-4">
         <button id="all-btn" class="btn btn-soft btn-primary">All</button>
         <button id="open-btn" class="btn btn-soft">Open</button>
         <button id="closed-btn" class="btn btn-soft">Closed</button>
      </div>
      </section>

      <section id="issues" class="w-11/12 bg-white mx-auto pl-5 flex gap-5 items-center justify-between shadow-sm rounded-md p-4" >

        <div class="issues ">
          <img src="assets/Aperture.png" alt="">
       </div>
       <div class="flex-1">
        <p id="issue-count" class="font-bold text-xl">50 issues </p>
        <p class="font-semibold text-[#647488]">Track and manage your project issues</p>
       </div>

       <div class="flex mr-5 gap-2">
        <img src="assets/Open-Status.png" alt="">
        <img src="assets/Closed-Status .png" alt="">
       </div>

      </section>


      <!-- loading -->
       <section id="issue-container" class="w-11/12 mx-auto mt-10 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

            <div class="col-span-full flex justify-center items-center min-h-[300px]">
              <span class="loading loading-spinner loading-xl"></span>
            </div>

      </section>

<dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">

    <div id="details-container" class="max-w-3xl p-8">

    <div class="modal-action">
      <form method="dialog">
